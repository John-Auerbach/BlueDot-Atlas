<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BlueDot Atlas</title>
<style>
  :root {
    --bg: #05080f;
    --panel: rgba(12, 18, 30, 0.92);
    --border: rgba(120, 160, 220, 0.25);
    --text: #e8eef7;
    --muted: #93a4bd;
    --accent: #4ea3ff;
    --accent-dim: #1d3a5c;
    --good: #46c98b;
    --warn: #f0a44a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  #globe { position: absolute; inset: 0; }

  /* Title */
  #brand {
    position: absolute; top: 18px; left: 22px; z-index: 5;
    pointer-events: none;
  }
  #brand h1 { margin: 0; font-size: 20px; letter-spacing: 0.5px; font-weight: 600; }
  #brand h1 span { color: var(--accent); }
  #brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

  /* Control card */
  #controls {
    position: absolute; top: 18px; right: 18px; z-index: 6;
    width: 280px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; backdrop-filter: blur(8px);
  }
  #controls h2 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .coord { font-size: 13px; color: var(--muted); margin-bottom: 12px; min-height: 18px; }
  .coord b { color: var(--text); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
  select, input[type=range] { width: 100%; }
  select {
    background: #0c1626; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px; font-size: 14px;
  }
  .radius-row { display: flex; align-items: center; gap: 10px; }
  .radius-row output { font-variant-numeric: tabular-nums; font-size: 13px; min-width: 56px; text-align: right; color: var(--text); }
  button#go {
    margin-top: 16px; width: 100%; padding: 11px; font-size: 14px; font-weight: 600;
    color: #05080f; background: var(--accent); border: none; border-radius: 8px;
    cursor: pointer; transition: background .15s, opacity .15s;
  }
  button#go:hover { background: #6cb6ff; }
  button#go:disabled { background: var(--accent-dim); color: var(--muted); cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.4; }

  /* Results panel */
  #results {
    position: absolute; top: 0; left: 0; bottom: 0; z-index: 7;
    width: 420px; max-width: 92vw; background: var(--panel);
    border-right: 1px solid var(--border); backdrop-filter: blur(8px);
    transform: translateX(-100%); transition: transform .28s ease;
    display: flex; flex-direction: column;
  }
  #results.open { transform: translateX(0); }
  #results header {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 18px 20px 12px; border-bottom: 1px solid var(--border);
  }
  #results header h2 { margin: 0; font-size: 18px; }
  #results header .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  #close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; }
  #close:hover { color: var(--text); }

  /* Reopen tab — shown when the results panel is minimized */
  #reopen {
    position: absolute; top: 50%; left: 0; transform: translateY(-50%);
    z-index: 6; display: none; align-items: center; justify-content: center;
    background: var(--panel); color: var(--accent);
    border: 1px solid var(--border); border-left: none;
    border-radius: 0 10px 10px 0; backdrop-filter: blur(8px);
    padding: 16px 7px; font-size: 16px; cursor: pointer; line-height: 1;
    transition: background .15s, color .15s;
  }
  #reopen.show { display: flex; }
  #reopen:hover { background: rgba(20,30,48,0.96); color: #6cb6ff; }
  #panel-body { overflow-y: auto; padding: 16px 20px 28px; }
  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin: 20px 0 10px; }
  .summary { font-size: 14px; line-height: 1.55; color: var(--text); }
  .culture { font-size: 13px; line-height: 1.55; color: var(--muted); }

  .card {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px; background: rgba(255,255,255,0.02);
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; }
  .card p { margin: 0 0 8px; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; }
  .meta a, .meta span { color: var(--accent); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-dim); color: var(--accent);
  }
  .badge.vol-yes { background: rgba(70,201,139,0.18); color: var(--good); }
  .src-links { margin-top: 8px; font-size: 12px; }
  .src-links a { color: var(--muted); text-decoration: none; display: inline-block; margin-right: 10px; }
  .src-links a:hover { color: var(--accent); text-decoration: underline; }

  .warnings { font-size: 12px; color: var(--warn); margin-top: 14px; }
  .empty { font-size: 13px; color: var(--muted); font-style: italic; }

  /* Loading / error overlay inside panel */
  #status { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 14px; }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid var(--accent-dim); border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div id="globe"></div>

  <div id="brand">
    <h1>Blue<span>Dot</span> Atlas</h1>
    <p>Click anywhere on Earth to explore.</p>
  </div>

  <div id="controls">
    <h2>Explore a place</h2>
    <div class="coord" id="coord">No location selected.</div>

    <label for="layer">Layer</label>
    <select id="layer">
      <option value="conservation">Conservation</option>
      <option value="humanitarian">Humanitarian</option>
      <option value="culture">Culture</option>
    </select>

    <label for="radius">Radius — <span id="radius-label">50</span> km</label>
    <div class="radius-row">
      <input type="range" id="radius" min="5" max="1000" step="5" value="50" />
    </div>

    <button id="go" disabled>Select a point first</button>
    <p class="hint">Tip: drag to rotate, scroll to zoom, then click a spot.</p>
  </div>

  <aside id="results">
    <header>
      <div>
        <h2 id="r-title">Results</h2>
        <div class="sub" id="r-sub"></div>
      </div>
      <button id="close" aria-label="Close">&times;</button>
    </header>
    <div id="panel-body">
      <div id="status" style="display:none;"></div>
      <div id="content"></div>
    </div>
  </aside>

  <button id="reopen" aria-label="Show results" title="Show results">&#9656;</button>

  <script src="https://unpkg.com/globe.gl@2.32.0/dist/globe.gl.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
